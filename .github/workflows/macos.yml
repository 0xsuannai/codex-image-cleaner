name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-build.txt
      - run: npm install -g @openai/codex@0.167.0
      - name: Build and verify native app
        run: python packaging/build_macos.py --verify-codex "$(command -v codex)"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*-macos-${{ matrix.arch }}.zip
            dist/*-macos-${{ matrix.arch }}.json
            dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
