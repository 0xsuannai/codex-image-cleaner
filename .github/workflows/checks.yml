name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install ruff==0.17.4
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: node --check ui/app.js
      - run: node --check packaging/browser_smoke.cjs
      - run: python -m unittest discover -s tests -v
      - run: python packaging/verify_web_ui.py
      - run: python -m compileall -q app.py app_support.py cleaner.py desktop.py webui.py runtime_check.py packaging tests
